<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PopChat</title>

    <link rel="stylesheet" href="styleHomePage.css" />
  </head>

  <body>
    <div id="app">
      <div id="sidebar">
        <div id="sidebarTop">
          <div id="topBar">
            <div id="logoArea">
              <img src="icone/icona2.png" id="logo" />

              <div>
                <h2>POP CHAT</h2>
              </div>
            </div>

            <!-- questo l'ho preso dal sito online cyber qualcosa -->

            <nav class="menu">
              <input type="checkbox" id="menu-toggle" class="menu-toggle" />

              <label for="menu-toggle" class="menu-icon"> ☰ </label>

              <ul class="menu-list">
                <li><a href="#">🏠 Home</a></li>

                <li><a href="#">💬 Chat</a></li>

                <li><a href="#">⚙️ Impostazioni</a></li>

                <li><a href="#">🚪 Logout</a></li>
              </ul>
            </nav>
          </div>
        </div>

        <div id="searchBar">
          <input
            id="searchInput"
            type="text"
            placeholder="Cerca conversazione..."
          />
        </div>

        <div id="userList">
          <div class="user" onclick="openChat('Mario Rossi')">
            <div class="avatar">
              <img src="icone/defaultUser.png" alt="" />
            </div>

            <div class="userInfo">
              <h4>Mario Rossi</h4>

              <p>Online ora</p>
            </div>
          </div>

          <div class="user" onclick="openChat('Luca Bianchi')">
            <div class="avatar">
              <img src="icone/defaultUser.png" alt="" />
            </div>

            <div class="userInfo">
              <h4>Luca Bianchi</h4>

              <p>Ti ha inviato una foto</p>
            </div>
          </div>

          <div class="user" onclick="openChat('Anna Verdi')">
            <div class="avatar">
              <img src="icone/defaultUser.png" alt="" />
            </div>

            <div class="userInfo">
              <h4>Anna Verdi</h4>

              <p>Hey 👋</p>
            </div>
          </div>

          <div class="user" onclick="openChat('Giulia Neri')">
            <div class="avatar">
              <img src="icone/defaultUser.png" alt="" />
            </div>

            <div class="userInfo">
              <h4>Giulia Neri</h4>

              <p>Ci sentiamo dopo!</p>
            </div>
          </div>
        </div>
      </div>

      <div id="chat">
        <div id="chatHeader">
          <span onclick="backToList()" id="backBtn"> ⬅ </span>

          <div id="chatHeaderInfo">
            <h3 id="chatTitle">POP CHAT</h3>

            <p>Online</p>
          </div>
        </div>

        <div id="messages">
          <div class="message received">WALLABY</div>

          <div class="message sent">6767676767676767676767</div>

          <div class="message received">XD</div>
        </div>

        <div id="inputBar">
          <input
            type="text"
            id="inviomessaggio"
            placeholder="Scrivi un messaggio..."
          />

          <button onclick="aggiungimessaggio()" id="inviaMsg">➜</button>
        </div>
      </div>
    </div>

    <script>
      (async () => {
        const res = await fetch("/check-session");
        const data = await res.json();
        if (!data.valid) window.location.href = "/index.html";
      })();
      const eventSource = new EventSource("/sse");
      eventSource.addEventListener("nuovo-messaggio", (e) => {
        const messaggio = JSON.parse(e.data);
        console.log("Nuovo messaggio:", messaggio); // aggiungere aggionramento nuovo messaggio
      });

      function openChat(name) {
        document.getElementById("chatTitle").innerText = name;

        if (window.innerWidth <= 768) {
          document.getElementById("sidebar").classList.add("hidden");

          document.getElementById("chat").classList.add("active");
        }
      }

      function backToList() {
        document.getElementById("sidebar").classList.remove("hidden");

        document.getElementById("chat").classList.remove("active");
      }

      messaggio = document.getElementById("inviomessaggio").value();

      function aggiungimessaggio() {
        if (messaggio != "" && messagio != " ") {
          /* aggiungere il messaggio alla schermata della chat e rendere
                   quella sezione in modo scorrevole quando aumentano i msg
                   sarebbe carino anche aggiungere le date e l'ora dei msg */
        }
      }
    </script>
  </body>
</html>
