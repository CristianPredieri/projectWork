<html>

<head>
    <title>PopChat - Login</title>

    <link rel='manifest' href='manifest.json'>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(() => console.log('Service Worker registrato'))
                .catch(err => console.log(err));
        }
    </script>

    <style>
        body {
            font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
            background: linear-gradient(to bottom right, #ffecd2, #fcb69f);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 40px;
            color: #fff;
            text-shadow: 2px 2px #ff5f6d;
        }

        #form {
            margin-top: 30px;
            background-color: #ff8b94;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 15px;
            border: 2px solid #fff;
            font-size: 16px;
        }

        input[type='submit'] {
            background-color: #ffde59;
            font-weight: bold;
            cursor: pointer;
        }

        input[type='submit']:hover {
            background-color: #ffb347;
            color: #fff;
        }

        #messaggio {
            margin-top: 10px;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>🎈 PopChat 🎈</h1>
    <a href='../'>back</a>
    <div id='form'>
        <h2>Accedi</h2>

        <form method='POST'  id="loginForm">
            <h2 id="badLogin"></h2>
            <input id="userTag" type='text' name='userTag' placeholder='Email o Username'
                required><br>

            <input  id="psw" type='password' name='password' placeholder='Password' required><br>

            <input type='submit' name='submit' value='Accedi'>
        </form>

    </div>
</body>

<script>
      const form = document.getElementById('loginForm')
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault() // Impedisce il comportamento predefinito del form
            const formData = new FormData(form)
            const data = Object.fromEntries(formData.entries()) // Converte i dati del form in un oggetto


            await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            }).then(res => res.json())
            .then(res => {
                if (res.redirect) {
                    window.location.href = res.redirect;
                } else {
                    document.getElementById('badLogin').textContent = "Credenziali errate, riprova!";
                    document.getElementById('badLogin').style.color = "red";
                    document.getElementById('userTag').value = "";
                    document.getElementById('psw').value = "";
                    document.getElementById('userTag').focus();
                    document.getElementById("userTag").style.borderColor = "red";
                    document.getElementById("psw").style.borderColor = "red";


                    document.getElementById("psw").addEventListener('input', () => {
                        document.getElementById("psw").style.borderColor = "";
                    })
                    document.getElementById("userTag").addEventListener('input', () => {
                        document.getElementById("userTag").style.borderColor = "";
                    })
                }
            })
        })
</script>
</html>
