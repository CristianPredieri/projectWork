<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PopChat - Login</title>

    <link rel="stylesheet" href="common.css" />
  </head>

  <body>
    <div class="container">
      <div class="logoArea">
        <img class="mascot" src="icone/icona2.png" />
      </div>

      <div id="form">
        <h2>Accedi</h2>

        <form method="POST" id="loginForm">
          <input
            id="userTag"
            type="text"
            name="userTag"
            placeholder="Email o Username"
            required
          />

          <div class="psw-wrapper">
            <input
              id="password"
              type="password"
              name="password"
              placeholder="Password"
              required
            />
            <button type="button" onclick="togglePsw('password', this)">
              🐵
            </button>
          </div>
          <h3 id="badLogin"></h3>

          <input type="submit" value="Accedi" />
        </form>
      </div>

      <a class="back" href="/index.html"> ← Torna indietro </a>
    </div>
  </body>

  <script>
    function togglePsw(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
      } else {
        input.type = "password";
        btn.textContent = "🐵";
      }
    }

    const badLogin = document.querySelector("#badLogin");
    const userTag = document.querySelector("#userTag");
    const psw = document.querySelector("#password");

    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        });

        const res = await response.json();

        if (res.redirect) {
          window.location.href = res.redirect;
        } else {
          badLogin.textContent = res.message || "Credenziali errate!"; // ← fix: era .text()

          userTag.value = ""; // ← fix: era .val()
          psw.value = ""; // ← fix: era .val()

          userTag.focus();

          userTag.style.border = "3px solid red"; // ← fix: era .css()
          psw.style.border = "3px solid red"; // ← fix: era .css()
        }
      } catch (err) {
        badLogin.textContent = "Errore di connessione"; // ← fix: era .text()
        console.error(err);
      }
    });

    userTag.addEventListener("input", () => {
      userTag.style.borderColor = "";
    });

    psw.addEventListener("input", () => {
      psw.style.borderColor = "";
    });
  </script>
</html>
