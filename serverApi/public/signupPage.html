<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PopChat - Sign Up</title>

    <link rel="stylesheet" href="common.css" />
  </head>

  <body>
    <div class="container">
      <div class="logoArea">
        <img class="mascot" src="icone/icona2.png" />
      </div>

      <div id="form">
        <h2>Iscriviti!</h2>
        <form id="signupForm">
          <input
            id="nome"
            type="text"
            name="nome"
            placeholder="Nome"
            minlength="3"
            required
          /><br />
          <input
            id="cognome"
            type="text"
            name="cognome"
            placeholder="Cognome"
            minlength="3"
            required
          /><br />
          <input
            id="email"
            type="email"
            name="email"
            placeholder="Email"
            minlength="3"
            required
          /><br />
          <input
            id="username"
            type="text"
            name="username"
            placeholder="Username"
            minlength="3"
            required
          />
          <div class="psw-wrapper">
            <input
              id="password"
              type="password"
              name="password"
              placeholder="Password"
              required
            />
            <button type="button" onclick="togglePsw('password', this)">
              🐵
            </button>
          </div>
          <div class="psw-wrapper">
            <input
              id="controlloPassword"
              type="password"
              name="controlloPassword"
              placeholder="Conferma la password"
              required
            />
            <button
              type="button"
              onclick="togglePsw('controlloPassword', this)"
            >
              🐵
            </button>
          </div>
          <input type="submit" value="Registrati" />
          <h3 id="badSignup"></h3>
        </form>
      </div>
      <a class="back" href="../"> ← Torna indietro </a>
    </div>
  </body>

  <script>
    function togglePsw(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (input.type === "password") {
        console.log("diventa text");
        input.type = "text";
        btn.textContent = "🙈";
      } else {
        input.type = "password";
        btn.textContent = "🐵";
      }
    }
    const form = document.getElementById("signupForm");

    const rules = {
      nome: {
        regex: /^[a-zA-ZÀ-ù\s]{2,30}$/,
        msg: "Nome non valido (solo lettere, 2-30 caratteri)",
      },
      cognome: {
        regex: /^[a-zA-ZÀ-ù\s]{2,30}$/,
        msg: "Cognome non valido (solo lettere, 2-30 caratteri)",
      },
      email: { regex: /^[^\s@]+@[^\s@]+\.[^\s@]+$/, msg: "Email non valida" },
      username: {
        regex: /^[a-zA-Z0-9._]{3,20}$/,
        msg: "Username non valido (solo lettere, numeri, '-' e '.')",
      },
      password: {
        regex: /^(?=.*[A-Z])(?=.*[0-9])(?=.*[^a-zA-Z0-9]).{8,}$/,
        msg: "La password deve avere almeno 8 caratteri, una maiuscola, un numero e un carattere speciale",
      },
    };

    function setError(fieldId) {
      const el = document.getElementById(fieldId);
      el.style.borderColor = "red";
      el.addEventListener(
        "input",
        () => {
          el.style.borderColor = "";
        },
        { once: true },
      );
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      const badSignup = document.getElementById("badSignup");

      // Validazione regex — segna TUTTI i campi sbagliati
      const errors = [];
      for (const [field, rule] of Object.entries(rules)) {
        if (!rule.regex.test(data[field])) {
          errors.push({ field, msg: rule.msg });
          setError(field);
        }
      }

      if (errors.length > 0) {
        badSignup.textContent = errors[0].msg; // mostra il messaggio del primo errore
        badSignup.style.color = "red";
        document.getElementById(errors[0].field).focus(); // focus sul primo campo sbagliato
        return;
      }

      // Controllo conferma password
      if (data.password != data.controlloPassword) {
        console.log(data.password, data.controllaPassword);
        badSignup.textContent = "Le password non coincidono";
        badSignup.style.color = "red";
        setError("password");
        setError("controlloPassword");
        document.getElementById("password").focus();
        return;
      }

      await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      })
        .then((res) => res.json())
        .then((res) => {
          if (res.redirect) {
            window.location.href = res.redirect;
          } else {
            badSignup.textContent =
              res.message || "Errore durante la registrazione";
            badSignup.style.color = "red";
          }
        });
    });
  </script>
</html>
