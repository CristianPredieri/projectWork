<html>

<head>
    <title>PopChat - Registrazione</title>
    <style>
        body {
            font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
            background: linear-gradient(to bottom right, #ffecd2, #fcb69f);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 40px;
            color: #fff;
            text-shadow: 2px 2px #ff5f6d;
        }

        #form {
            margin-top: 30px;
            background-color: #ff8b94;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 15px;
            border: 2px solid #fff;
        }

        input[type='submit'] {
            background-color: #ffde59;
            font-weight: bold;
            cursor: pointer;
        }

        input[type='submit']:hover {
            background-color: #ffb347;
            color: #fff;
        }

        #feedback {
            margin-top: 10px;
            font-weight: bold;
        }
        .psw-wrapper {
    position: relative;
    width: 90%;
    margin: 0 auto 15px;
}

.psw-wrapper input {
    width: 100%;
    margin-bottom: 0;
    box-sizing: border-box;
}

.psw-wrapper button {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    padding: 0;
}
    </style>
</head>

<body>
    <h1>🎈 PopChat 🎈</h1>
    <a href='../'>back</a>

    <div id='form'>
        <h2>Iscriviti!</h2>
        <form id="signupForm">
            <input id="nome" type='text' name='nome' placeholder='Nome' required><br>
            <input id="cognome" type='text' name='cognome' placeholder='Cognome' required><br>
            <input id="email" type='email' name='email' placeholder='Email' required><br>
            <input id="username" type="text" name = "username" placeholder = "Username" required></input>
                <div class="psw-wrapper">
                    <input id="password" type='password' name='password' placeholder='Password' required>
                    <button type="button" onclick="togglePsw('password', this)">🐵</button>
                </div>
                <div class="psw-wrapper">
                    <input id="controlloPassword" type='password' name='controlloPassword' placeholder='Conferma la password' required>
                    <button type="button" onclick="togglePsw('controlloPassword', this)">🐵</button>
                </div>
            <input type='submit' value='Iscriviti'>
            <h3 id="feedback"></h3>
        </form>
    </div>
</body>

<script>


    function togglePsw(fieldId, btn) {
        const input = document.getElementById(fieldId)
        if (input.type === 'password') {
            console.log("diventa text")
            input.type = 'text'
            btn.textContent = '🙈'
        } else {
            input.type = 'password'
            btn.textContent = '🐵'
        }
    }
    const form = document.getElementById('signupForm')

    const rules = {
        nome: { regex: /^[a-zA-ZÀ-ù\s]{2,30}$/, msg: "Nome non valido (solo lettere, 2-30 caratteri)" },
        cognome: { regex: /^[a-zA-ZÀ-ù\s]{2,30}$/, msg: "Cognome non valido (solo lettere, 2-30 caratteri)" },
        email: { regex: /^[^\s@]+@[^\s@]+\.[^\s@]+$/, msg: "Email non valida" },
        username: {regex : /^[a-zA-Z0-9._]{3,20}$/ , msg : "Username non valido (solo lettere, numeri, '-' e '.')"},
        password: {
            regex: /^(?=.*[A-Z])(?=.*[0-9])(?=.*[^a-zA-Z0-9]).{8,}$/,
            msg: "La password deve avere almeno 8 caratteri, una maiuscola, un numero e un carattere speciale"
            }    }

    function setError(fieldId) {
        const el = document.getElementById(fieldId)
        el.style.borderColor = "red"
        el.addEventListener('input', () => {
            el.style.borderColor = ""
        }, { once: true })
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault()
        const formData = new FormData(form)
        const data = Object.fromEntries(formData.entries())
        const feedback = document.getElementById('feedback')

        // Validazione regex — segna TUTTI i campi sbagliati
        const errors = []
        for (const [field, rule] of Object.entries(rules)) {
            if (!rule.regex.test(data[field])) {
                errors.push({ field, msg: rule.msg })
                setError(field)
            }
        }

        if (errors.length > 0) {
            feedback.textContent = errors[0].msg  // mostra il messaggio del primo errore
            feedback.style.color = "red"
            document.getElementById(errors[0].field).focus()  // focus sul primo campo sbagliato
            return
        }

        // Controllo conferma password
        if (data.password != data.controlloPassword) {
            console.log(data.password, data.controllaPassword)
            feedback.textContent = "Le password non coincidono"
            feedback.style.color = "red"
            setError('password')
            setError('controlloPassword')
            document.getElementById('password').focus()
            return
        }

        await fetch('/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
            .then(res => res.json())
            .then(res => {
                if (res.redirect) {
                    window.location.href = res.redirect
                } else {
                    feedback.textContent = res.message || "Errore durante la registrazione"
                    feedback.style.color = "red"
                }
            })
    })
</script>
</html>
