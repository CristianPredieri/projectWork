<html>

<head>
    <title>PopChat - Registrazione</title>
    <style>
        body {
            font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
            background: linear-gradient(to bottom right, #ffecd2, #fcb69f);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 40px;
            color: #fff;
            text-shadow: 2px 2px #ff5f6d;
        }

        #form {
            margin-top: 30px;
            background-color: #ff8b94;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 15px;
            border: 2px solid #fff;
        }

        input[type='submit'] {
            background-color: #ffde59;
            font-weight: bold;
            cursor: pointer;
        }

        #welcome {
            margin-top: 15px;
            color: black;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>🎈 PopChat 🎈</h1>

    <a href='../' >back</a>

    <div id='form'>
        <h2>Iscriviti!</h2>
        <form method='POST'>
            <input type='text' name='nome' placeholder='Nome' value='" . htmlspecialchars($nome) . "' required><br>

            <input type='text' name='cognome' placeholder='Cognome' value='" . htmlspecialchars($cognome) . "'
                required><br>

            <input type='tel' name='telefono' placeholder='Telefono' value='" . htmlspecialchars($telefono) . "'
                required><br>

            <input type='password' name='password' placeholder='Password' required><br>

            <input type='submit' name='submit' value='Iscriviti'>
        </form>

        " . ($messaggio ? "<div id='welcome'>$messaggio</div>" : "") . "
    </div>

    <div id='users'>
        <h3>Utenti registrati (test)</h3>
        $users
    </div>

</body>

</html>
