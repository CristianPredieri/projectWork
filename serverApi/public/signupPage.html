<html>
  <head>
    <!-- Metadati e configurazione della pagina -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PopChat - Sign Up</title>
    <!-- Foglio di stile comune a tutte le pagine di autenticazione -->
    <link rel="stylesheet" href="common.css" />
  </head>

  <body>
    <div class="container">
      <!-- Logo dell'applicazione -->
      <div class="logoArea">
        <img class="mascot" src="icone/icona2.png" />
      </div>

      <!-- Form di registrazione -->
      <div id="form">
        <h2>Iscriviti!</h2>
        <form id="signupForm">
          <!-- Campo nome -->
          <input
            id="nome"
            type="text"
            name="nome"
            placeholder="Nome"
            minlength="3"
            required
          /><br />
          <!-- Campo cognome -->
          <input
            id="cognome"
            type="text"
            name="cognome"
            placeholder="Cognome"
            minlength="3"
            required
          /><br />
          <!-- Campo email -->
          <input
            id="email"
            type="email"
            name="email"
            placeholder="Email"
            minlength="3"
            required
          /><br />
          <!-- Campo username -->
          <input
            id="username"
            type="text"
            name="username"
            placeholder="Username"
            minlength="3"
            required
          />
          <!-- Campo password con pulsante mostra/nascondi -->
          <div class="psw-wrapper">
            <input
              id="password"
              type="password"
              name="password"
              placeholder="Password"
              required
            />
            <!-- Pulsante per visualizzare la password -->
            <button type="button" onclick="togglePsw('password', this)">
              🐵
            </button>
          </div>
          <!-- Campo conferma password -->
          <div class="psw-wrapper">
            <input
              id="controlloPassword"
              type="password"
              name="controlloPassword"
              placeholder="Conferma la password"
              required
            />
            <!-- Pulsante per visualizzare la conferma password -->
            <button
              type="button"
              onclick="togglePsw('controlloPassword', this)"
            >
              🐵
            </button>
          </div>
          <!-- Pulsante di invio del form -->
          <input type="submit" value="Registrati" />
          <!-- Messaggio di errore (se presente) -->
          <h3 id="badSignup"></h3>
        </form>
      </div>
      <!-- Link per tornare indietro -->
      <a class="back" href="../"> ← Torna indietro </a>
    </div>
  </body>

  <script>
    // Funzione per mostrare/nascondere la password
    function togglePsw(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (input.type === "password") {
        // Cambia da password a text (visibile)
        input.type = "text";
        btn.textContent = "🙈";
      } else {
        // Cambia da text a password (nascosto)
        input.type = "password";
        btn.textContent = "🐵";
      }
    }

    // Regole di validazione per i campi del form
    const rules = {
      nome: {
        regex: /^[a-zA-ZÀ-ù\s]{2,30}$/,
        msg: "Nome non valido (solo lettere, 2-30 caratteri)",
      },
      cognome: {
        regex: /^[a-zA-ZÀ-ù\s]{2,30}$/,
        msg: "Cognome non valido (solo lettere, 2-30 caratteri)",
      },
      email: { regex: /^[^\s@]+@[^\s@]+\.[^\s@]+$/, msg: "Email non valida" },
      username: {
        regex: /^[a-zA-Z0-9._]{3,20}$/,
        msg: "Username non valido (solo lettere, numeri, '-' e '.')",
      },
      password: {
        regex: /^(?=.*[A-Z])(?=.*[0-9])(?=.*[^a-zA-Z0-9]).{8,}$/,
        msg: "La password deve avere almeno 8 caratteri, una maiuscola, un numero e un carattere speciale",
      },
    };

    // Funzione per evidenziare il campo con errore
    function setError(fieldId) {
      const el = document.getElementById(fieldId);
      el.style.borderColor = "red";
      // Rimuove il bordo rosso quando l'utente inizia a digitare
      el.addEventListener(
        "input",
        () => {
          el.style.borderColor = "";
        },
        { once: true },
      );
    }

    // Seleziona il form
    const form = document.getElementById("signupForm");

    // Event listener per l'invio del form
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      // Raccoglie i dati del form
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      const badSignup = document.getElementById("badSignup");

      // Validazione regex - segna TUTTI i campi sbagliati
      const errors = [];
      for (const [field, rule] of Object.entries(rules)) {
        if (!rule.regex.test(data[field])) {
          errors.push({ field, msg: rule.msg });
          setError(field);
        }
      }

      // Se ci sono errori di validazione, mostra il primo e termina
      if (errors.length > 0) {
        badSignup.textContent = errors[0].msg;
        badSignup.style.color = "red";
        document.getElementById(errors[0].field).focus();
        return;
      }

      // Controlla che le due password coincidano
      if (data.password != data.controlloPassword) {
        badSignup.textContent = "Le password non coincidono";
        badSignup.style.color = "red";
        setError("password");
        setError("controlloPassword");
        document.getElementById("password").focus();
        return;
      }

      // Invia i dati di registrazione al server
      await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      })
        .then((res) => res.json())
        .then((res) => {
          // Se la registrazione è riuscita, reindirizza al login
          if (res.redirect) {
            window.location.href = res.redirect;
          } else {
            // Mostra il messaggio di errore
            badSignup.textContent =
              res.message || "Errore durante la registrazione";
            badSignup.style.color = "red";
          }
        });
    });
  </script>
</html>
